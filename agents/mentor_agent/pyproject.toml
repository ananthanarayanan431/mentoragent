[project]
name = "mentor-agent"
version = "0.1.0"
description = "Where human expertise meets AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "typer>=0.12.0",
    "anthropic>=0.75.0",
    "langchain-anthropic>=1.0.0",
    "openai>=2.0.0",
    "langchain-openai>=0.3.25",
    "langchain-core>=0.3.34",
    "langchain-mongodb>=0.4.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.70",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "opik>=1.4.11",
    "pydantic-settings>=2.7.1",
    "pymongo>=4.13.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "langchain-community>=0.3.17",
    "wikipedia>=1.4.0",
    "pydantic>=2.10.6",
    "datasketch>=1.6.5",
    "uvicorn>=0.34.3",
    "arcadepy>=1.6.0",
    "pypdf>=5.7.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "httpx>=0.28.0",
    "youtube-transcript-api>=1.1.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
mentor-agent = "mentor_agent.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mentor_agent"]

# --- Coverage ---------------------------------------------------------------
# scripts/ci/python-checks.sh measures coverage when this section exists and
# fails under the floor. Raise the floor as coverage grows; never lower it.

[tool.coverage.run]
# Next to the other tool caches at the repo root, not inside the agent.
data_file = "../../.coverage"
source = ["mentor_agent"]
branch = true

[tool.coverage.report]
# Measured over every module, including ones no test imports yet (evals,
# full memory creation). Raise it as those get tests; never lower it.
fail_under = 74
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
