# Included wherever a location sets its own add_header.
#
# nginx does not merge add_header across levels: a location with any add_header
# of its own drops every one inherited from the server block. Keeping these in
# one file and including them explicitly is what stops a cache-control header
# from quietly taking the security headers off a response.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# 'unsafe-inline' for scripts covers the pre-paint theme snippet in index.html;
# styles need it for Tailwind's inline style attributes. connect-src keeps
# ws/wss open for the chat socket. Fonts come from Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
