# Area labels for pull requests, applied by .github/workflows/pr-labels.yml from
# the paths a PR touches. A PR gets every label whose paths it matches.

agent:
  - changed-files:
      - any-glob-to-any-file: agents/**

frontend:
  - changed-files:
      - any-glob-to-any-file: frontend/**

infra:
  - changed-files:
      - any-glob-to-any-file:
          - docker-compose.yml
          - agents/*/docker-compose.yml
          - "**/Dockerfile"
          - "**/.dockerignore"
          - frontend/nginx.conf.template

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/uv.lock"
          - frontend/package-lock.json

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/ci/**
          - .githooks/**

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
