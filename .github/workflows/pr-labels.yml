# Labels every pull request:
#   type:  from the Conventional Commit title (feat -> feature, fix -> bug-fix, ...)
#   area:  from the paths it touches (rules in .github/labeler.yml)
# and assigns the PR to its author when it is opened.
# Runs on pull_request_target so it can label PRs from forks. It never checks out
# or runs the PR's code, which keeps the write token safe.
name: PR labels

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  type:
    name: Type label from title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const TYPE_LABELS = {
              feat: 'feature',
              fix: 'bug-fix',
              chore: 'chore',
              docs: 'docs',
              refactor: 'refactor',
              test: 'test',
              ci: 'ci',
              perf: 'perf',
              build: 'build',
              style: 'style',
              revert: 'revert',
            };
            const pr = context.payload.pull_request;
            const match = /^(\w+)(\([^)]*\))?(!)?:/.exec(pr.title);
            const type = match && TYPE_LABELS[match[1]];
            const wanted = new Set([type, match && match[3] ? 'breaking' : null].filter(Boolean));

            // Drop type labels left over from an earlier title. `docs` and `ci` are also
            // area labels, so they stay when the area job would add them anyway.
            const managed = new Set([...Object.values(TYPE_LABELS), 'breaking']);
            managed.delete('docs');
            managed.delete('ci');
            const current = pr.labels.map((label) => label.name);
            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number };

            for (const name of current) {
              if (managed.has(name) && !wanted.has(name)) {
                await github.rest.issues.removeLabel({ ...issue, name });
              }
            }
            const missing = [...wanted].filter((name) => !current.includes(name));
            if (missing.length) {
              await github.rest.issues.addLabels({ ...issue, labels: missing });
            }
            if (!type) {
              core.warning(`Title "${pr.title}" is not a Conventional Commit, so no type label was added.`);
            }

  assignee:
    name: Assign the author
    # Only when the PR is opened, so a later manual reassignment is kept. Bots such as
    # Dependabot cannot be assigned, so their PRs are skipped.
    if: github.event.action == 'opened' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.assignees.length === 0) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [pr.user.login],
              });
            }

  area:
    name: Area labels from changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
