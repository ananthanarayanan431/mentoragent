[project]
name = "mentoragents"
version = "0.1.0"
description = "Where human expertise meets AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "typer>=0.12.0",
    "openai>=2.0.0",
    "langchain-openai>=0.3.25",
    "langchain-core>=0.3.34",
    "langchain-mongodb>=0.4.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.70",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "opik>=1.4.11",
    "pydantic-settings>=2.7.1",
    "pymongo>=4.13.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "langchain-community>=0.3.17",
    "wikipedia>=1.4.0",
    "pydantic>=2.10.6",
    "datasketch>=1.6.5",
    "uvicorn>=0.34.3",
    "arcadepy>=1.6.0",
    "pypdf>=5.7.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.66.0",
    "youtube-transcript-api>=1.1.0",
]

[project.scripts]
mentoragent = "mentoragent.cli:app"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# --- Ruff -------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade: modern syntax (list[str], X | None, ...)
    "FA",      # flake8-future-annotations
    "B",       # bugbear
    "SIM",     # simplify
    "C4",      # comprehensions
    "RUF",     # ruff-specific
    "PTH",     # prefer pathlib
    "S",       # bandit (security)
    "T20",     # no stray print()
    "PIE",
    "RET",
    "ERA",     # commented-out code
    "ASYNC",   # async pitfalls (blocking calls in coroutines)
    "TC",      # type-checking-only imports
    "TID",     # banned imports (see below)
    # Error-handling standard
    "BLE",     # no blind `except Exception:` that swallows errors
    "TRY",     # exception anti-patterns
    "EM",      # message in a variable first, so tracebacks don't print it twice
]
ignore = [
    "S104",   # binding to 0.0.0.0 is intentional in containers
    "RUF012", # pydantic/class-level mutable defaults are fine
    "SIM300", # misfires on UPPER_CASE settings fields (treats them as constants)
    "TRY003", # long messages outside the exception class: EM already covers this
]

[tool.ruff.lint.isort]
# Every module starts with this import; ruff adds it when missing.
required-imports = ["from __future__ import annotations"]
known-first-party = ["mentoragent"]

[tool.ruff.lint.per-file-ignores]
# Tests may use assert, subprocess and print, and raise inline messages as fixtures.
"tests/**" = ["S", "T20", "EM"]
"main.py" = ["T20"]
# FastAPI resolves route signatures (including Depends parameter types) at
# runtime, so those imports must not move under `if TYPE_CHECKING:`.
"src/mentoragent/api/routes/**" = ["TC001", "TC002", "TC003"]
"src/mentoragent/api/dependencies.py" = ["TC001", "TC002", "TC003"]
# Typer builds the CLI from the command signatures at runtime.
"src/mentoragent/cli.py" = ["TC001", "TC002", "TC003"]

# FastAPI dependency markers are meant to be called as default values.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

# Pydantic and FastAPI read annotations while the app runs, so moving their
# imports under `if TYPE_CHECKING:` would crash at startup, not just lint.
[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions", "fastapi"]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "typing.TypedDict",
]
runtime-evaluated-decorators = ["pydantic.validate_call"]

# Architecture rules as lint errors.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.timezone".msg = "Use `from datetime import UTC` instead."

# --- Pyright ----------------------------------------------------------------

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests", "main.py"]
venvPath = "."
venv = ".venv"
# langgraph and datasketch ship without a py.typed marker. Pyright still infers
# their types from the source, so a missing stub is not worth an error.
reportMissingTypeStubs = false

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
